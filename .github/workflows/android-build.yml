name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_PLATFORM: 'android-34'
      ANDROID_BUILD_TOOLS: '34.0.0'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JDK 8 (for sdkmanager only)
        run: sudo apt-get update -y && sudo apt-get install -y openjdk-8-jdk-headless

      - name: Add Android SDK tools to PATH
        run: |
          if [ -d "${ANDROID_SDK_ROOT}/tools/bin" ]; then
            echo "${ANDROID_SDK_ROOT}/tools/bin" >> $GITHUB_PATH
          fi
          if [ -d "${ANDROID_SDK_ROOT}/platform-tools" ]; then
            echo "${ANDROID_SDK_ROOT}/platform-tools" >> $GITHUB_PATH
          fi

      - name: Install required SDK packages
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          sdkmanager --list || true
          sdkmanager "cmdline-tools;latest" "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Accept SDK licenses
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          yes | sdkmanager --licenses

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --build-cache

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ClockApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: app/build/reports/
