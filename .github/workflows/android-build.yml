name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ANDROID_PLATFORM: 'android-34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure sdkmanager is on PATH
        # persist path additions for following steps
        run: |
          if [ -d "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" ]; then
            echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          fi
          if [ -d "${ANDROID_SDK_ROOT}/tools/bin" ]; then
            echo "${ANDROID_SDK_ROOT}/tools/bin" >> $GITHUB_PATH
          fi
          if [ -d "${ANDROID_SDK_ROOT}/platform-tools" ]; then
            echo "${ANDROID_SDK_ROOT}/platform-tools" >> $GITHUB_PATH
          fi

      - name: Install required SDK packages
        run: |
          # Install cmdline-tools if missing, then required packages
          sdkmanager --list || true
          sdkmanager "cmdline-tools;latest" "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ClockApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: app/build/reports/
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
