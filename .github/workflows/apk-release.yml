name: APK Release

on:
  workflow_run:
    workflows: [Android build]
    types: [completed]
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ClockApp-debug-apk
          path: ./apk-artifact

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./apk-artifact/app-debug.apk
          asset_name: ClockApp-debug.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Generate APK summary
        run: |
          if [ -f ./apk-artifact/app-debug.apk ]; then
            echo "## APK Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "**Build Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "**APK File:** app-debug.apk" >> $GITHUB_STEP_SUMMARY
            ls -lh ./apk-artifact/app-debug.apk >> $GITHUB_STEP_SUMMARY
          fi
